name: veylora_ai
description: VEYLORA AI - intelligent Flutter assistant
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.0
  supabase_flutter: ^2.15.4
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # Flutter 3.24.5 is incompatible with app_links 6.4.x Android Gradle setup.
  # Supabase uses app_links for OAuth/deep-link handling.
  app_links: 6.3.2

flutter:
  uses-material-design: true
