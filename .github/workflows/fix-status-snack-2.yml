name: Fix Status Viewer snack 2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add snack helper inside _StatusViewerState
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('flutter_app/lib/status_page.dart')
          text = p.read_text()
          marker = 'class _StatusViewerState extends State<_StatusViewer> {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('StatusViewerState marker not found')
          end = text.find('\nclass ', start + len(marker))
          if end < 0:
              end = len(text)
          block = text[start:end]
          helper = "  void snack(String message) => ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message)));"
          if helper in block:
              print('snack helper already exists inside _StatusViewerState')
          else:
              text = text[:start + len(marker)] + '\n' + helper + text[start + len(marker):]
              p.write_text(text)
              print('Added snack helper inside _StatusViewerState')
          PY

      - name: Verify and commit fix
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('flutter_app/lib/status_page.dart').read_text()
          marker = 'class _StatusViewerState extends State<_StatusViewer> {'
          start = text.find(marker)
          end = text.find('\nclass ', start + len(marker))
          block = text[start:end if end >= 0 else len(text)]
          helper = "void snack(String message) => ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message)));"
          if helper not in block:
              raise SystemExit('Verification failed: helper is not inside _StatusViewerState')
          print('Verified helper is inside _StatusViewerState')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/status_page.dart
          git rm .github/workflows/fix-status-snack-2.yml
          git commit -m "Fix missing status viewer snack method"
          git push
