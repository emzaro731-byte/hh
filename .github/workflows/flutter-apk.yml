name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "FIREBASE_GOOGLE_SERVICES_JSON secret is not configured."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          PACKAGE=$(python3 -c 'import json; print(json.load(open("android/app/google-services.json"))["client"][0]["client_info"]["android_client_info"]["package_name"])')
          echo "FIREBASE_ANDROID_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "Firebase Android package detected: $PACKAGE"

      - name: Reset Flutter generated state
        run: |
          set -e
          rm -rf .dart_tool build
          flutter pub get

      - name: Generate GG launcher icons
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            density=$(echo "$spec" | cut -d' ' -f1)
            size=$(echo "$spec" | cut -d' ' -f2)
            mkdir -p "android/app/src/main/res/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" assets/gg_messenger_logo.svg -o "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          echo "GG launcher icons generated from assets/gg_messenger_logo.svg"

      - name: Verify Flutter source
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/gg_messenger_logo.svg
          if grep -R -n -F '***' lib --include='*.dart'; then
            echo "ERROR: Literal *** corruption found in Dart source."
            exit 1
          fi
          echo "Dart source verification passed."
          flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --target=lib/main.dart --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gg-messenger-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
