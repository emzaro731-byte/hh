name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=veylora_ai .

      - name: Remove generated sample test and launcher icons
        run: |
          rm -f test/widget_test.dart
          rm -rf android/app/src/main/res/mipmap-*

      - name: Configure VEYLORA premium launcher icon and auth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/veylora_icon"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/veylora_icon"')
          marker = '''        <meta-data android:name="flutter_deeplinking_enabled" android:value="false" />\n        <intent-filter>\n                    <action android:name="android.intent.action.VIEW" />\n                    <category android:name="android.intent.category.DEFAULT" />\n                    <category android:name="android.intent.category.BROWSABLE" />\n                    <data android:scheme="veylora" android:host="auth-callback" />\n                </intent-filter>\n'''
          if 'android:scheme="veylora"' not in s:
              s = s.replace('</activity>', marker + '        </activity>', 1)
          p.write_text(s)
          PY

      - name: Verify premium icon is present
        run: test -f android/app/src/main/res/drawable/veylora_icon.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: GitHub Actions secret SUPABASE_URL is empty or missing."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: GitHub Actions secret SUPABASE_ANON_KEY is empty or missing."
            exit 1
          fi

          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "ERROR: SUPABASE_URL must be the Supabase Project URL, for example https://<project-ref>.supabase.co"
              exit 1
              ;;
          esac

          host="${SUPABASE_URL#https://}"
          host="${host%%/*}"

          if ! getent hosts "$host" >/dev/null; then
            echo "ERROR: Supabase hostname does not resolve: $host"
            echo "Check the SUPABASE_URL GitHub secret against the Project URL in Supabase Dashboard."
            exit 1
          fi

          echo "Supabase hostname resolves successfully: $host"

          # /auth/v1/settings requires the public API key. A 401 without the
          # apikey header does not mean that Supabase is unreachable.
          status=$(curl --silent --show-error --max-time 15 \
            -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/settings")

          case "$status" in
            2*|401|403) ;;
            *)
              echo "ERROR: Supabase Auth endpoint check returned HTTP $status at $SUPABASE_URL"
              exit 1
              ;;
          esac

          echo "Supabase Auth endpoint responded successfully (HTTP $status)."

      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="https://vihbsfrwnslnmheowkhy.supabase.co" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
