name: Build GG Messenger APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Create native Android project when missing
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf /tmp/gg-native
            npx @react-native-community/cli@20.0.2 init GGMessenger --version 0.81.4 --skip-install --directory /tmp/gg-native
            cp -R /tmp/gg-native/android ./android
          fi

      - name: Configure Firebase for Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GitHub secret FIREBASE_GOOGLE_SERVICES_JSON"
            echo "Add the Firebase Android google-services.json contents as this repository secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          app = Path('android/app/build.gradle')
          root_text = root.read_text()
          if 'com.google.gms:google-services' not in root_text:
              root_text = 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath("com.google.gms:google-services:4.4.4")\n    }\n}\n\n' + root_text
              root.write_text(root_text)
          app_text = app.read_text()
          if 'com.google.gms.google-services' not in app_text:
              app_text += '\napply plugin: "com.google.gms.google-services"\n'
              app.write_text(app_text)
          PY

      - name: Add WebRTC and call notification permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          if 'xmlns:tools=' not in text:
              text = text.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          permissions = '''\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n'''
          if 'android.permission.CAMERA' not in text:
              text = text.replace('<application', permissions + '    <application', 1)
          receivers = '''\n        <receiver\n            android:name="app.notifee.core.RebootBroadcastReceiver"\n            android:exported="false"\n            tools:replace="android:exported" />\n        <receiver\n            android:name="app.notifee.core.NotificationAlarmReceiver"\n            android:exported="false"\n            tools:replace="android:exported" />\n'''
          if 'app.notifee.core.RebootBroadcastReceiver' not in text:
              text = text.replace('</application>', receivers + '    </application>', 1)
          if 'android:showWhenLocked="true"' not in text:
              text = text.replace('<activity android:name=".MainActivity"', '<activity android:name=".MainActivity" android:showWhenLocked="true" android:turnScreenOn="true"', 1)
          p.write_text(text)
          PY

      - name: Prepare Supabase environment
        run: |
          printf 'SUPABASE_URL=%s\n' "${{ secrets.SUPABASE_URL }}" > .env
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gg-messenger-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
