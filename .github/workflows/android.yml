name: Build GG Messenger APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Create native Android project when missing
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf /tmp/gg-native
            npx @react-native-community/cli@latest init GGMessenger --version 0.81.4 --skip-install --directory /tmp/gg-native
            cp -R /tmp/gg-native/android ./android
          fi

      - name: Prepare Supabase environment
        run: |
          printf 'SUPABASE_URL=%s\n' "${{ secrets.SUPABASE_URL }}" > .env
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gg-messenger-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
