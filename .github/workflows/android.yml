name: VEYLOLA Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=veylola_ai .

      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart

      - name: Install the Veylola premium icon
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/veylola_icon.png android/app/src/main/res/drawable-nodpi/veylola_icon.png
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/veylola_icon"')
          text = text.replace('android:label="@string/app_name"', 'android:label="VEYLOLA"')
          manifest.write_text(text)
          PY
          test -f android/app/src/main/res/drawable-nodpi/veylola_icon.png
          echo "Using the checked-in Veylola icon. No icon generator is used."

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "SUPABASE_ANON_KEY secret is missing"; exit 1; }
          echo "Supabase URL and publishable/anon key are available to the build."

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylola-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
