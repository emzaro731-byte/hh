name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "Missing GitHub secret SUPABASE_PROJECT_ID"
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "SUPABASE_PROJECT_ID does not look like a Supabase project Reference ID"
            exit 1
          fi
          echo "Supabase project: $SUPABASE_PROJECT_ID"
          echo "Access token: configured"

      - name: Deploy ai-generate
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy ai-generate \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --debug

      - name: Deploy remaining Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            [ "$name" = "ai-generate" ] && continue
            echo "Deploying Function: $name"
            supabase functions deploy "$name" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --debug
          done
